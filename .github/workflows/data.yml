name: Generate Global OSM Data

on:
  schedule:
    - cron: "0 0 1 * *"  # Monthly on the 1st at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-global-osm-data
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region:
          - europe
          - russia
          - north_america
          - central_america_caribbean
          - south_america
          - northern_africa
          - western_africa
          - middle_africa
          - eastern_africa
          - southern_africa
          - western_asia
          - central_asia
          - southern_asia
          - southeastern_asia
          - eastern_asia
          - oceania

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install package
        run: uv pip install --system -e .

      - name: Extract ${{ matrix.region }}
        run: |
          mkdir -p datasets
          python scripts/extract_region.py \
            --region ${{ matrix.region }} \
            --clear-cache \
            -o datasets/osm_${{ matrix.region }}.csv

      - name: Region summary
        run: |
          echo "=== ${{ matrix.region }} ==="
          wc -l datasets/osm_${{ matrix.region }}.csv
          wc -l datasets/osm_${{ matrix.region }}_rejected.csv || true

      - name: Upload region artifacts
        uses: actions/upload-artifact@v4
        with:
          name: region-${{ matrix.region }}
          path: |
            datasets/osm_${{ matrix.region }}.csv
            datasets/osm_${{ matrix.region }}_rejected.csv
            datasets/osm_${{ matrix.region }}_rejected.geojson
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install package
        run: uv pip install --system -e .

      - name: Download all region artifacts
        uses: actions/download-artifact@v4
        with:
          path: datasets
          pattern: region-*
          merge-multiple: true

      - name: Merge regional datasets into global
        run: python scripts/merge_global.py

      - name: Global summary
        run: |
          echo "=== osm_global.csv.gz ==="
          ls -lh osm_global.csv.gz
          gzip -dc osm_global.csv.gz | wc -l
          gzip -dc osm_global.csv.gz | head -1
          echo ""
          echo "=== osm_global_rejected_plants.csv.gz ==="
          ls -lh osm_global_rejected_plants.csv.gz
          gzip -dc osm_global_rejected_plants.csv.gz | wc -l
          echo ""
          echo "=== osm_global_rejected_plants.geojson.gz ==="
          ls -lh osm_global_rejected_plants.geojson.gz

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f datasets/osm_*.csv datasets/osm_*_rejected.csv datasets/osm_*_rejected.geojson
          git add -f osm_global.csv.gz osm_global_rejected_plants.csv.gz osm_global_rejected_plants.geojson.gz
          git diff --staged --quiet || git commit -m "chore: update OSM global dataset [skip ci]"
          git push
