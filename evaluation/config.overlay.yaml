# Remove pm's default latitude filter; without this the main_query drops
# the entire Southern Hemisphere.
main_query: "Name != ''"

# OSM source. reliability_score=3 and net_capacity=true must be repeated
# because pm replaces the whole OSM block rather than merging with upstream.
OSM:
  reliability_score: 3
  net_capacity: true
  fn: osm_global.csv
  url: https://raw.githubusercontent.com/open-energy-transition/osm-powerplants/main/osm_global.csv

# Country scope: union of OSM + GEM country coverage (221 countries).
